    <ellipse cx="987" cy="110" rx="172" ry="109" fill="url(#green)"/>
    <ellipse cx="1122" cy="109" rx="150" ry="108" fill="url(#blue)"/>
    <ellipse cx="982" cy="305" rx="185" ry="12" fill="#0c131c" opacity=".6"/>
    <path d="M748 91 Q950 143 1210 81 Q1216 80 1216 88 L1216 212 Q1216 218 1209 220 Q951 278 748 224 Q742 222 742 217 L742 97 Q742 90 748 91Z" fill="url(#shell)" stroke="#546677" stroke-width="1.6"/>
    <path d="M748 99 Q951 151 1210 89" fill="none" stroke="url(#zones)" stroke-width="5" stroke-linecap="round"/>
    <path d="M758 110 Q952 158 1201 101" fill="none" stroke="#637080" stroke-width="1" opacity=".52"/>
    <path d="M756 190 Q954 234 1203 179 L1203 207 Q953 263 756 212Z" fill="url(#vents)" opacity=".63"/>
    <path d="M877 150 Q957 167 1055 147 L1038 197 Q961 216 894 199Z" fill="#202d3c" stroke="#455463" stroke-width="1.6"/>
    <path d="M956 172 L995 169 L989 276 L973 284 L951 278Z" fill="url(#stand)" stroke="#4a5969" stroke-width="1.4"/>
    <path d="M953 272 L975 279 L992 271 L1083 296 L1070 303 L973 286 L883 311 L865 307Z" fill="#2e3d4f" stroke="#566678" stroke-linejoin="round"/>
    <path d="M968 179 L979 178 L978 207 L967 209Z" fill="#0f1b27" stroke="#405163"/>
