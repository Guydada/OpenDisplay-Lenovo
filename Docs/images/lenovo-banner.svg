    <text x="60" y="151" font-size="86" font-weight="700" letter-spacing="-2" fill="#f5f8fc">OpenDisplay</text>
    <text x="61" y="235" font-size="86" font-weight="400" letter-spacing="-2" fill="#99e3d3">Lenovo</text>
    <text x="65" y="296" font-size="29" fill="#d6dee8">Menu-bar lighting for the Legion Y34wz-30</text>
