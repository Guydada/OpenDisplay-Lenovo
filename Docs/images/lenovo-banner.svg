      <rect x="66" width="28" height="5" rx="2.5" fill="#ffda73"/><rect x="99" width="28" height="5" rx="2.5" fill="#43e0b1"/>
      <rect x="132" width="28" height="5" rx="2.5" fill="#59a7ff"/><rect x="165" width="28" height="5" rx="2.5" fill="#b183ff"/>
