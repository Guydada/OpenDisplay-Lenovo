<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="352" viewBox="0 0 1280 352" role="img" aria-labelledby="title desc">
  <title id="title">OpenDisplay Lenovo</title>
  <desc id="desc">A curved ultrawide monitor casts bands of colored light behind it. Menu-bar lighting for the Lenovo Legion Y34wz-30 on macOS.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2=".22" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b111b"/><stop offset=".53" stop-color="#131f31"/><stop offset="1" stop-color="#16283a"/>
    </linearGradient>
    <linearGradient id="zones">
      <stop stop-color="#ff526c"/><stop offset=".19" stop-color="#ffad50"/><stop offset=".36" stop-color="#ffda73"/>
      <stop offset=".56" stop-color="#43e0b1"/><stop offset=".79" stop-color="#59a7ff"/><stop offset="1" stop-color="#b183ff"/>
    </linearGradient>
    <linearGradient id="shell" x2=".3" y2="1">
      <stop stop-color="#465568"/><stop offset=".24" stop-color="#273545"/><stop offset="1" stop-color="#111925"/>
    </linearGradient>
    <linearGradient id="stand" x2="1" y2=".5">
      <stop stop-color="#101b29"/><stop offset=".61" stop-color="#344355"/><stop offset=".67" stop-color="#172535"/><stop offset="1" stop-color="#101825"/>
    </linearGradient>
    <radialGradient id="red"><stop stop-color="#f37758" stop-opacity=".54"/><stop offset="1" stop-color="#f37758" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop stop-color="#40e2af" stop-opacity=".62"/><stop offset="1" stop-color="#40e2af" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#6889ff" stop-opacity=".7"/><stop offset="1" stop-color="#6889ff" stop-opacity="0"/></radialGradient>
    <pattern id="vents" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M1 1v3" stroke="#09111d" stroke-width="2" stroke-linecap="round"/></pattern>
  </defs>
  <rect width="1280" height="352" rx="20" fill="url(#canvas)"/>
  <g>
